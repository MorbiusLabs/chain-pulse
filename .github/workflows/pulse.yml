name: pulse

# Every 5 minutes: check all chains and append one row to history.json on the `data` branch.
# The data branch is kept to a single commit, so the repo stays small and GitHub Pages
# (which builds from main) is not rebuilt on every snapshot.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load current history
        run: |
          mkdir -p out
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/history.json?t=$(date +%s)" -o out/history.json || echo "starting a new history"

      - name: Take snapshot
        run: node scripts/snapshot.mjs out/history.json

      - name: Publish to data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "chain-pulse bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -q -m "pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" data
